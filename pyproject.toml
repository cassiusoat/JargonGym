[project]
name = "jargongym"
version = "0.1.0"
description = "A tiny local web demo for memorizing Claude Code jargon."
requires-python = ">=3.9"
dependencies = [
    "flask>=3.0",
    "markdown>=3.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

